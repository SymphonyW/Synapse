name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway-go/go.mod
          cache: true
          cache-dependency-path: services/gateway-go/go.sum

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt failed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  ai-engine:
    name: AI Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-engine-py
    env:
      SYNAPSE_MODEL_PROVIDER: mock
      SYNAPSE_MEMORY_BACKEND: file
      SYNAPSE_OPENAI_API_KEY: ""
      SYNAPSE_VECTOR_EMBEDDING_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-engine-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Agent regression
        run: python -m app.benchmarks.regression

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  proto-check:
    name: Proto Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway-go/go.mod
          cache: true
          cache-dependency-path: services/gateway-go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-engine-py/requirements.txt

      - name: Install proto tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -r services/ai-engine-py/requirements.txt

      - name: Generate proto stubs
        run: make proto

      - name: Check generated files are current
        shell: bash
        run: |
          git diff --exit-code
          untracked="$(git status --short --untracked-files=all services/gateway-go/internal/gen services/ai-engine-py/synapse)"
          if [ -n "$untracked" ]; then
            echo "Generated proto files are not tracked or are missing from the committed tree:"
            echo "$untracked"
            exit 1
          fi
