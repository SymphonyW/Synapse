name: Docker Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    env:
      SYNAPSE_MODEL_PROVIDER: mock
      SYNAPSE_OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Run smoke test
        run: bash scripts/ci-smoke.sh

      - name: Dump container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

