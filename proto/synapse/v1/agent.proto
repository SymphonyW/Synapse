syntax = "proto3";

package synapse.v1;

option go_package = "github.com/synapse/synapse/services/gateway-go/internal/gen/synapse/v1;agentv1";

// 健康检查请求体，当前无字段。
message HealthRequest {}

// 健康检查响应，包含运行状态与模型提供方。
message HealthResponse {
  string status = 1;
  string model_provider = 2;
}

// 网关提交任务时传递的请求载荷。
message SubmitTaskRequest {
  string task_id = 1;
  string user_id = 2;
  string prompt = 3;
  map<string, string> metadata = 4;
}

// Agent 事件类型枚举。
enum AgentEventType {
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  AGENT_EVENT_TYPE_STARTED = 1;
  AGENT_EVENT_TYPE_TOKEN = 2;
  AGENT_EVENT_TYPE_INFO = 3;
  AGENT_EVENT_TYPE_COMPLETED = 4;
  AGENT_EVENT_TYPE_FAILED = 5;
}

// Agent 流式事件载荷。
message AgentEvent {
  AgentEventType type = 1;
  string message = 2;
  string token = 3;
  string trace_id = 4;
  int64 emitted_at_unix_ms = 5;
  string schema_version = 6;

  oneof typed_payload {
    PerceiveEvent perceive = 20;
    PlanEvent plan = 21;
    ToolSelectedEvent tool_selected = 22;
    ToolStartedEvent tool_started = 23;
    ToolFinishedEvent tool_finished = 24;
    ApprovalRequiredEvent approval_required = 25;
    MemoryRecallEvent memory_recall = 26;
    MemoryWriteEvent memory_write = 27;
    EvaluationEvent evaluation = 28;
    ReplanEvent replan = 29;
    SynthesisModeEvent synthesis_mode = 30;
    ToolFailedEvent tool_failed = 31;
    ToolSkippedEvent tool_skipped = 32;
  }
}

message PerceiveEvent {
  string task_id = 1;
  int32 short_context_count = 2;
  int32 recalled_memory_count = 3;
}

message PlanEvent {
  int32 step_count = 1;
  repeated string steps = 2;
}

message ToolSelectedEvent {
  int32 step_index = 1;
  string objective = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string risk_level = 5;
  string input_preview = 6;
  bool requires_approval = 7;
  string provider_name = 8;
}

message ToolStartedEvent {
  int32 step_index = 1;
  string objective = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string risk_level = 5;
  string input_preview = 6;
  bool requires_approval = 7;
  string provider_name = 8;
}

message ToolFinishedEvent {
  int32 step_index = 1;
  string objective = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string risk_level = 5;
  string input_preview = 6;
  string output_preview = 7;
  int64 duration_ms = 8;
  bool ok = 9;
  string error_code = 10;
  string error_message = 11;
  bool requires_approval = 12;
  string provider_name = 13;
}

message ToolFailedEvent {
  int32 step_index = 1;
  string objective = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string risk_level = 5;
  string input_preview = 6;
  string output_preview = 7;
  int64 duration_ms = 8;
  bool ok = 9;
  string error_code = 10;
  string error_message = 11;
  bool requires_approval = 12;
  string provider_name = 13;
}

message ToolSkippedEvent {
  int32 step_index = 1;
  string objective = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string risk_level = 5;
  string input_preview = 6;
  string reason = 7;
  bool requires_approval = 8;
  string provider_name = 9;
}

message ApprovedToolCallEvent {
  string tool_name = 1;
  string tool_input = 2;
  string risk_level = 3;
  string reason = 4;
  int32 resume_step_index = 5;
}

message ApprovalRequiredEvent {
  int32 step_index = 1;
  int32 resume_step_index = 2;
  string tool_name = 3;
  string tool_input = 4;
  string risk_level = 5;
  string reason = 6;
  string tool_call_id = 7;
  string approval_reason = 8;
  ApprovedToolCallEvent approved_tool_call = 9;
  string objective = 10;
}

message MemoryEventHit {
  string memory_id = 1;
  string summary = 2;
  string content_preview = 3;
  string source_task_id = 4;
  double importance = 5;
  double score = 6;
  repeated string matched_terms = 7;
  int64 created_at = 8;
}

message MemoryRecallEvent {
  string query = 1;
  int32 hit_count = 2;
  repeated MemoryEventHit hits = 3;
}

message MemoryWriteEvent {
  string memory_id = 1;
  string user_id = 2;
  string summary = 3;
  string content_preview = 4;
  string source_task_id = 5;
  double importance = 6;
  int64 created_at = 7;
}

message EvaluationEvent {
  double estimated_success = 1;
  double objective_completion = 2;
  double tool_success_rate = 3;
  int32 blocked_actions = 4;
  int64 duration_ms = 5;
}

message ReplanEvent {
  int32 step_index = 1;
  string reason = 2;
  string from_tool = 3;
  string to_tool = 4;
  string to_tool_input = 5;
}

message SynthesisModeEvent {
  string mode = 1;
}

// 长期记忆记录，和 AI Engine 内部 MemoryStore 结构保持同名字段。
message MemoryRecord {
  string memory_id = 1;
  string user_id = 2;
  string content = 3;
  string summary = 4;
  string source_task_id = 5;
  double importance = 6;
  int64 created_at = 7;
}

// 召回结果在记录之外附带当前查询的匹配分数和命中词。
message MemoryRecallHit {
  MemoryRecord record = 1;
  double score = 2;
  repeated string matched_terms = 3;
}

message MemoryWriteRequest {
  string user_id = 1;
  string content = 2;
  string summary = 3;
  string source_task_id = 4;
  double importance = 5;
}

message MemoryWriteResponse {
  MemoryRecord record = 1;
}

message MemoryRecallRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;
}

message MemoryRecallResponse {
  repeated MemoryRecallHit hits = 1;
}

message MemoryDeleteRequest {
  string user_id = 1;
  string memory_id = 2;
}

message MemoryDeleteResponse {
  bool deleted = 1;
}

message MemoryListRequest {
  string user_id = 1;
  int32 limit = 2;
}

message MemoryListResponse {
  repeated MemoryRecord items = 1;
}

message StringList {
  repeated string items = 1;
}

message ToolPolicy {
  map<string, StringList> role_allow = 1;
  repeated string approval_required = 2;
  repeated string disabled_tools = 3;
  int64 version = 4;
  int64 updated_at_unix_ms = 5;
  string updated_by = 6;
  string description = 7;
}

message GetToolPolicyRequest {}

message GetToolPolicyResponse {
  ToolPolicy policy = 1;
}

message ApplyToolPolicyRequest {
  ToolPolicy policy = 1;
}

message ApplyToolPolicyResponse {
  ToolPolicy policy = 1;
  bool applied = 2;
}

message ListToolsRequest {}

message ToolDescriptor {
  string name = 1;
  string description = 2;
  string risk_level = 3;
  bool requires_approval = 4;
  string provider_name = 5;
  bool currently_disabled = 6;
  repeated string allowed_roles = 7;
}

message ListToolsResponse {
  repeated ToolDescriptor items = 1;
}

// 运行时服务：提供健康检查、任务流式执行与长期记忆管理。
service AgentRuntime {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (stream AgentEvent);
  rpc MemoryWrite(MemoryWriteRequest) returns (MemoryWriteResponse);
  rpc MemoryRecall(MemoryRecallRequest) returns (MemoryRecallResponse);
  rpc MemoryDelete(MemoryDeleteRequest) returns (MemoryDeleteResponse);
  rpc MemoryList(MemoryListRequest) returns (MemoryListResponse);
  rpc GetToolPolicy(GetToolPolicyRequest) returns (GetToolPolicyResponse);
  rpc ApplyToolPolicy(ApplyToolPolicyRequest) returns (ApplyToolPolicyResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
}
